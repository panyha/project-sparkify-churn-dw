name: sparkify_dw
version: "1.0.0"
config-version: 2

profile: sparkify_dw

model-paths: ["models"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Business assumptions used by the KPI layer — change here, not in SQL
  ad_cpm_usd: 10.0            # estimated revenue per 1,000 ad impressions
  skip_threshold_ratio: 0.5   # a play counts as "skipped" if listened < 50% of song length
  churn_lookback_days: 14     # window before cancellation used for churn signals

seeds:
  sparkify_dw:
    +schema: ref
    +quote_columns: false

models:
  sparkify_dw:
    staging:
      +schema: staging
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
    kpi:
      +schema: kpi
      +materialized: table
