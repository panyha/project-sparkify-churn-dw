    description: "[Content Popularity] Top 10 เพลงและศิลปินในแต่ละช่วงเวลา — Horizontal bar"
  - name: kpi_churn_funnel
    description: "[Customer Retention] Churn funnel แยกตามระดับสมาชิก — Funnel chart"
  - name: kpi_user_churn_features
    description: "[คำถามธุรกิจ 2] พฤติกรรมช่วง N วันสุดท้ายของผู้ใช้แต่ละคน + churn_risk_score — Churn Risk Monitor"
