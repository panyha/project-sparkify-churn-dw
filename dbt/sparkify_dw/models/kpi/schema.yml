version: 2

models:
  - name: kpi_user_activity_daily
    description: "[User Engagement] DAU, MAU (rolling 30 วัน), stickiness, sessions — Line chart"
    columns:
      - name: full_date
        tests: [unique, not_null]
  - name: kpi_listening_by_level
    description: "[Music Consumption] ชั่วโมงการฟัง Free vs Paid รายสัปดาห์/ช่วงเวลา — 100% stacked bar"
  - name: kpi_listening_heatmap
    description: "[คำถามธุรกิจ 1] การฟังตามวัน × ชั่วโมง — Heatmap"
